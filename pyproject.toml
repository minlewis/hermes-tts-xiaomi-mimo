[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hermes-tts-xiaomi-mimo"
version = "0.1.0"
description = "Hermes Agent plugin for Xiaomi MiMo-V2.5 TTS/ASR provider"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/minlewis/hermes-tts-xiaomi-mimo"

[tool.setuptools.packages.find]
where = ["src"]
